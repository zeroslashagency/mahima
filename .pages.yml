  - name: play
    label: Zen Playground page
    type: file
    path: content/play.json
    format: json
    fields:
      - name: backLink
        label: Back link text
        type: string
      - name: heading
        label: Heading
        type: string
      - name: description
        label: Description
        type: text
        description: Intro sentence under the heading. The highlight text below is styled brighter.
      - name: descriptionHighlight
        label: Highlight text
        type: string
        description: Short phrase inside the description that is highlighted, for example 1-7.
